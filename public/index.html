<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EO Signup via CroxyProxy</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fb; color: #1a1a1a; }
      .card { background: #fff; border-radius: 10px; padding: 1rem 1.2rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); max-width: 700px; }
      label { display: block; margin-top: .7rem; font-weight: 600; }
      input, button { padding: .6rem; margin-top: .2rem; width: 100%; box-sizing: border-box; }
      button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
      button:hover { background: #1557b0; }
      .status { margin-top: 1rem; padding: .7rem; border-radius: 6px; }
      .ok { background: #e6f7ec; color: #165b2f; }
      .err { background: #fde8e8; color: #8a1f1f; }
      .captcha { margin-top: 1rem; border: 1px solid #ddd; padding: .6rem; border-radius: 6px; background: #fff; }
      img { max-width: 100%; }
      .hidden { display: none; }
      .hint { font-size: .9rem; color: #555; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Cadastro EO (3º formulário) via CroxyProxy</h2>
      <p class="hint">Informe o prefixo do usuário e o intervalo numérico do sufixo.</p>

      <label for="prefixo">Prefixo do username</label>
      <input id="prefixo" placeholder="ex.: player" />

      <label for="inicio">Início do sufixo</label>
      <input id="inicio" type="number" placeholder="ex.: 100" />

      <label for="fim">Fim do sufixo</label>
      <input id="fim" type="number" placeholder="ex.: 999" />

      <label for="senha">Senha</label>
      <input id="senha" type="text" value="SenhaFixa@123" />

      <label for="email">E-mail</label>
      <input id="emailInput" type="email" value="email.fixo@example.com" />

      <button id="startBtn">Iniciar automação</button>

      <div id="status" class="status hidden"></div>

      <div id="captchaBox" class="captcha hidden">
        <h3>Captcha</h3>
        <p><strong>Username gerado:</strong> <span id="username"></span></p>
        <p><strong>Senha usada:</strong> <span id="password"></span></p>
        <p><strong>E-mail usado:</strong> <span id="email"></span></p>
        <img id="captchaImg" alt="captcha" />

        <label for="captchaTexto">Digite o captcha resolvido</label>
        <input id="captchaTexto" placeholder="texto do captcha" />
        <button id="submitCaptchaBtn">Enviar captcha e concluir cadastro</button>
      </div>
    </div>

    <script>
      let sessionId = null;

      function showStatus(message, type = 'ok') {
        const el = document.getElementById('status');
        el.classList.remove('hidden', 'ok', 'err');
        el.classList.add(type === 'ok' ? 'ok' : 'err');
        el.textContent = message;
      }

      document.getElementById('startBtn').addEventListener('click', async () => {
        const prefixo = document.getElementById('prefixo').value.trim();
        const sufixoInicio = Number(document.getElementById('inicio').value);
        const sufixoFim = Number(document.getElementById('fim').value);
        const senha = document.getElementById('senha').value.trim();
        const email = document.getElementById('emailInput').value.trim();

        try {
          const response = await fetch('/api/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prefixo, sufixoInicio, sufixoFim, senha, email })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Falha ao iniciar.');
          }

          sessionId = data.sessionId;
          document.getElementById('username').textContent = data.username;
          document.getElementById('password').textContent = data.password;
          document.getElementById('email').textContent = data.email;
          document.getElementById('captchaImg').src = data.captchaImage;

          document.getElementById('captchaBox').classList.remove('hidden');
          showStatus('Formulário preenchido. Resolva o captcha e envie.', 'ok');
        } catch (error) {
          showStatus(error.message, 'err');
        }
      });

      document.getElementById('submitCaptchaBtn').addEventListener('click', async () => {
        const captchaTexto = document.getElementById('captchaTexto').value.trim();

        if (!sessionId) {
          showStatus('Nenhuma sessão iniciada.', 'err');
          return;
        }

        try {
          const response = await fetch('/api/submit-captcha', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, captchaTexto })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Falha ao enviar captcha.');
          }

          showStatus(data.message, 'ok');
          sessionId = null;
        } catch (error) {
          showStatus(error.message, 'err');
        }
      });
    </script>
  </body>
</html>
